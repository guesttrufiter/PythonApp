# Name of our GitHub Actions automated CI/CD pipeline workflow
name: CI Pipeline

# Define trigger events: run workflow on pushes and pull requests targeting main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Define jobs to be executed in the workflow pipeline
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment version 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated unit tests using pytest
      - name: Run Pytest Unit Tests
        run: pytest

      # Step 5: Build Docker container image to verify containerization build integrity
      - name: Build Docker Image
        run: docker build -t python-cicd-app:v1 .